<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
		<link rel="icon" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" type="image/png" />
		<link rel="icon" sizes="16x16" href="%sveltekit.assets%/favicon-16.png" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<!-- Brand overlay: fonts (and any deployment-specific look) live outside the bundle so
		     they can be swapped at deploy time. See static/brand/brand.css. -->
		<link rel="stylesheet" href="%sveltekit.assets%/brand/brand.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
